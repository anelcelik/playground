include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - flutter/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Reference drop-ins from the design restructure — kept for diffing,
    # not part of the package tree.
    - iOS app design improvements*/**
  errors:
    # Keep the tree clean — unused code fails CI instead of accumulating.
    unused_local_variable: warning
    unused_element: warning
    unused_import: warning
