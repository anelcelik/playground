name: Build iOS App

on:
  push:
    branches: [main]
    paths:
      - 'IOS/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'IOS/**'
  workflow_dispatch:

jobs:
  build-ios:
    name: Flutter iOS build (unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Generate iOS project files
        working-directory: IOS
        run: |
          flutter create \
            --project-name playground_tracker \
            --org com.playground.tracker \
            --platforms ios \
            .
          # linux/ was generated locally for UI preview — remove it from iOS CI
          rm -rf linux android

      - name: Install Flutter dependencies
        working-directory: IOS
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: IOS/ios
        run: pod install

      - name: Analyze Dart code
        working-directory: IOS
        run: |
          # flutter create generates a default widget_test.dart that references
          # a non-existent MyApp class — delete it before analyzing
          rm -f test/widget_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build iOS (no code signing — compile validation only)
        working-directory: IOS
        run: flutter build ios --no-codesign --release

      - name: Upload Runner.app artifact
        uses: actions/upload-artifact@v4
        with:
          name: playground-tracker-ios-${{ github.sha }}
          path: IOS/build/ios/iphoneos/Runner.app
          if-no-files-found: warn
          retention-days: 14

