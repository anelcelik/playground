name: Build iOS IPA (unsigned)

on:
  push:
    branches: [main]
    paths:
      - 'IOS/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'IOS/**'
  workflow_dispatch:

jobs:
  build-ios:
    name: Flutter iOS unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      # The ios/ platform folder is committed (it contains CloudKitPlugin.swift,
      # the CloudKit-aware AppDelegate/SceneDelegate, and Runner.entitlements),
      # so no `flutter create` here — that would build an app without sync.
      - name: Install dependencies
        working-directory: IOS
        run: flutter pub get

      - name: Generate app icons
        working-directory: IOS
        run: dart run flutter_launcher_icons

      - name: Analyze Dart code
        working-directory: IOS
        run: flutter analyze

      - name: Run tests
        working-directory: IOS
        run: flutter test

      - name: Build iOS unsigned release
        working-directory: IOS
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        working-directory: IOS
        run: |
          mkdir -p build/Payload
          cp -r build/ios/iphoneos/Runner.app build/Payload/
          cd build
          zip -r playground-tracker-unsigned.ipa Payload/
          echo "IPA size: $(du -sh playground-tracker-unsigned.ipa)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: playground-tracker-ios-unsigned-${{ github.sha }}
          path: IOS/build/playground-tracker-unsigned.ipa
          retention-days: 14
