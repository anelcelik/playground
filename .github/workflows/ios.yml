name: Build iOS IPA (unsigned)

on:
  push:
    branches: [main]
    paths:
      - 'IOS/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'IOS/**'
  workflow_dispatch:

jobs:
  build-ios:
    name: Flutter iOS unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      # The ios/ platform folder is committed (it contains CloudKitPlugin.swift,
      # the CloudKit-aware AppDelegate/SceneDelegate, and Runner.entitlements),
      # so no `flutter create` here — that would build an app without sync.
      - name: Install dependencies
        working-directory: IOS
        run: flutter pub get

      - name: Generate app icons
        working-directory: IOS
        run: dart run flutter_launcher_icons

      # The Modernist system has no radii, no emoji and one toggle widget.
      # These are cheap to reintroduce by accident and invisible in review,
      # so the build fails on them rather than letting the UI drift back.
      # Python, not grep -P: the macOS runner ships BSD grep, which has no -P.
      - name: Check design-system invariants
        working-directory: IOS
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys

          CHECKS = [
              ("rounded corner", r"BorderRadius\.circular",
               "use BorderRadius.zero — the system has no radii"),
              ("emoji in source",
               "[\U0001F300-\U0001FAFF\u2600-\u27BF\u2B00-\u2BFF]",
               "use a Material icon instead"),
              ("capsule toggle", r"Switch\.adaptive|(?<!Square)\bSwitch\(",
               "use SquareSwitch from widgets/modernist.dart"),
              ("circular avatar", r"CircleAvatar|BoxShape\.circle",
               "use a square Container"),
          ]

          failed = False
          for path in sorted(pathlib.Path("lib").rglob("*.dart")):
              for lineno, line in enumerate(
                      path.read_text(encoding="utf-8").splitlines(), 1):
                  for name, pattern, hint in CHECKS:
                      if re.search(pattern, line):
                          print(f"::error file={path},line={lineno}::"
                                f"{name} — {hint}")
                          print(f"  {path}:{lineno}: {line.strip()}")
                          failed = True
          sys.exit(1 if failed else 0)
          EOF

      - name: Analyze Dart code
        working-directory: IOS
        run: flutter analyze

      - name: Run tests
        working-directory: IOS
        run: flutter test

      - name: Build iOS unsigned release
        working-directory: IOS
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        working-directory: IOS
        run: |
          mkdir -p build/Payload
          cp -r build/ios/iphoneos/Runner.app build/Payload/
          cd build
          zip -r playground-tracker-unsigned.ipa Payload/
          echo "IPA size: $(du -sh playground-tracker-unsigned.ipa)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: playground-tracker-ios-unsigned-${{ github.sha }}
          path: IOS/build/playground-tracker-unsigned.ipa
          retention-days: 14
