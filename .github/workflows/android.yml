name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'ANDROID/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ANDROID/**'
  workflow_dispatch:

jobs:
  build-android:
    name: Flutter Android debug APK
    runs-on: ubuntu-latest        # ← Linux runner — much faster & cheaper than macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: ANDROID
        run: |
          flutter create \
            --project-name playground_tracker \
            --org com.playground.tracker \
            --platforms android \
            .
          rm -f test/widget_test.dart

      - name: Fix Kotlin JVM target compatibility
        working-directory: ANDROID/android
        run: echo "kotlin.jvm.target.validation.mode=IGNORE" >> gradle.properties

      - name: Add notification permissions to AndroidManifest
        working-directory: ANDROID
        run: |
          python3 << 'EOF'
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path) as f:
              src = f.read()
          if 'POST_NOTIFICATIONS' not in src:
              perms = (
                  '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
                  '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n'
                  '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n'
              )
              src = src.replace('<application', perms + '\n    <application')
              with open(path, 'w') as f:
                  f.write(src)
              print('Manifest patched with notification permissions')
          else:
              print('Manifest already has permissions')
          EOF

      - name: Enable core library desugaring (required by flutter_local_notifications)
        working-directory: ANDROID
        run: |
          python3 << 'EOF'
          import os, glob

          # Flutter 3.16+ uses Kotlin DSL (.kts), older uses Groovy (.gradle)
          candidates = glob.glob('android/app/build.gradle.kts') + \
                       glob.glob('android/app/build.gradle')

          if not candidates:
              print("No build.gradle found — listing android/app/:")
              for f in os.listdir('android/app'):
                  print(' ', f)
              raise SystemExit(1)

          path = candidates[0]
          print(f'Patching: {path}')
          is_kts = path.endswith('.kts')

          with open(path) as f:
              src = f.read()

          if is_kts:
              # Kotlin DSL: add isCoreLibraryDesugaringEnabled inside compileOptions
              src = src.replace(
                  'compileOptions {',
                  'compileOptions {\n        isCoreLibraryDesugaringEnabled = true'
              )
              # Append a new dependencies block (Gradle merges multiple blocks)
              src += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          else:
              # Groovy DSL
              src = src.replace(
                  'compileOptions {',
                  'compileOptions {\n        coreLibraryDesugaringEnabled true'
              )
              src += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"

          with open(path, 'w') as f:
              f.write(src)
          print('Patched OK')
          EOF

      - name: Install dependencies
        working-directory: ANDROID
        run: flutter pub get

      - name: Generate app icons
        working-directory: ANDROID
        run: dart run flutter_launcher_icons

      - name: Analyze Dart code
        working-directory: ANDROID
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build debug APK
        working-directory: ANDROID
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: playground-tracker-android-debug-${{ github.sha }}
          path: ANDROID/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # ── Release APK (unsigned — sideloadable on any Android) ──────────────────
  # Uncomment to also build a release APK (smaller, faster, but unsigned)
  #
  # build-android-release:
  #   runs-on: ubuntu-latest
  #   steps:
  #     ... same steps but:
  #     run: flutter build apk --release --no-shrink
  #     path: ANDROID/build/app/outputs/flutter-apk/app-release.apk
