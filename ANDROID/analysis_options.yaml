include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - flutter/**
    - build/**
  errors:
    # Downgraded to info so CI analyze step doesn't fail on these.
    # These are leftover artifacts from the dark-mode colour refactoring —
    # cosmetic, not bugs. Will be cleaned up in a future pass.
    unused_local_variable: info
    unused_element: info
    unused_import: info
